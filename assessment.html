<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="twitter:card" content="summary">
<meta 
  property="og:url" 
  content="https://Yui-1219.github.io/assessment/assessment.html">
<meta property="og:title" content="あなたのいいところ診断">
<meta 
  property="og:description" 
  content="ZEN Study Web アプリケーション開発コースで制作した、「あなたのいいところ診断」サイトです。">
  <link rel="stylesheet" href="assessment.css">
  <title>あなたのいいところ診断</title>
</head>

<body>
  <h1>あなたのいいところは？</h1>
  <h3>診断したい名前を入れてください</h3>
  <input type="text" id="user-name" maxlength="20" style="width: 60%; height: 60px; font-size: 20px; padding: 6px; box-sizing: border-box;">

<script>
 {
    const autoFitUserName = document.getElementById('user-name');
    if (autoFitUserName) {
      autoFitUserName.addEventListener('input', (event) => {
        const el = event.target;
        if (el.value.length > 20) {
          el.value = el.value.slice(0, 20);
        }

        let size = 20;
        el.style.fontSize = size + 'px';
        while (el.scrollWidth > el.clientWidth && size > 10) {
          size--;
          el.style.fontSize = size + 'px';
        }
      });
    }
  }
</script>

  <button id="assessment">診断する</button>
  <div id="result-area"></div>
  <div id="tweet-area"></div>
  <script src="assessment.js"></script>
</body>

</html>
